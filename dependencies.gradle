dependencies {
    compileOnly 'com.google.guava:guava:17.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'com.google.code.gson:gson:2.2.4'
	implementation("com.github.GTNewHorizons:CodeChickenCore:1.5.0:dev")
    api('com.github.GTNewHorizons:GTNHLib:0.11.54:dev')

    shadowImplementation('com.sk89q:jchronic:0.2.4a') { exclude group: 'junit' }
    shadowImplementation 'com.sk89q.lib:jlibnoise:1.0.0'

    devOnlyNonPublishable 'com.github.GTNewHorizons:ArchitectureCraft:1.13.0:dev'
    devOnlyNonPublishable 'com.github.GTNewHorizons:ForgeMultipart:1.8.0:dev'
    devOnlyNonPublishable 'com.github.GTNewHorizons:CarpentersBlocks:3.8.0-GTNH:dev'

    runtimeOnlyNonPublishable 'com.github.GTNewHorizons:NotEnoughItems:2.9.2-GTNH:dev'

    testImplementation 'junit:junit:4.13.2'
    // GTNHExtLib only provides these in the game
    testRuntimeOnly 'com.mojang:brigadier:1.0.18'
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.18'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}
